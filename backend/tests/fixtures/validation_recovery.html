<!doctype html><html><body><form><label for="city">City</label><input id="city" required><div id="error" role="alert" hidden>Please select a city from the suggestions.</div><button type="button" id="next">Next</button><script>
document.querySelector('#next').onclick=()=>{const ok=document.querySelector('#city').dataset.selected==='true';document.querySelector('#city').setAttribute('aria-invalid',String(!ok));document.querySelector('#error').hidden=ok};
</script></form></body></html>
