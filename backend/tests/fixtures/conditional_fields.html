<!doctype html><html><body><form><fieldset><legend>Do you require visa sponsorship?</legend><label><input type="radio" name="visa" value="no" checked>No</label><label><input type="radio" name="visa" value="yes">Yes</label></fieldset><label id="details" hidden>Sponsorship details<textarea required></textarea></label><script>
