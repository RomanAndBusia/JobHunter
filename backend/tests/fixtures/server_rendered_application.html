<!doctype html><html lang="pl"><body>
<!-- Representative synthetic ASP.NET-style fixture, not the user's missing HTML. -->
<form id="application">
<fieldset><legend>Salutation</legend><label><input name="ctl$Title" type="radio" value="mr">Mr</label><label><input name="ctl$Title" type="radio" value="ms">Ms</label></fieldset>
<label for="ctl_First">First name *</label><input id="ctl_First" name="ctl$First">
<label for="ctl_Last">Last name</label><input id="ctl_Last" required>
<label for="ctl_Email">Email</label><input id="ctl_Email" type="email" required>
<label for="ctl_Phone">Phone</label><input id="ctl_Phone" type="tel" required>
<label for="ctl_Region">Region</label><select id="ctl_Region" onchange="document.querySelector('#district').hidden=false"><option value="">Choose</option><option>Region A</option></select>
<div id="district" hidden><label for="ctl_District">District</label><select id="ctl_District" required><option value="">Choose</option><option>District A</option></select></div>
<fieldset id="language-widget"><legend>Foreign languages</legend>
<label for="ctl_Language">Language</label><select id="ctl_Language"><option value="">Choose</option><option value="en">English</option><option value="de">German</option></select>
<label for="ctl_Level">Language level</label><select id="ctl_Level"><option value="">Choose</option><option value="b1">B1</option><option value="b2">B2</option><option value="c1">C1</option><option value="none">None</option></select>
<input type="button" id="ctl_AddLanguage" value="Add language">
<input type="hidden" id="ctl_LanguageState" required value="[]"><ul id="language-entries"></ul>
</fieldset>
<div class="question" id="fraction"><input type="hidden" name="OpenQuestionId" value="q41">
<label>Podaj proszę preferowany przez Ciebie wymiar etatu (możesz wybrać więcej, niż jedną odpowiedź)</label>
<span id="ctl_Fraction"><label><input type="checkbox" name="ctl$Fraction$0" value="1">pełny etat</label><label><input type="checkbox" name="ctl$Fraction$1" value=".75">3/4 etatu</label><label><input type="checkbox" name="ctl$Fraction$2" value=".5">1/2 etatu</label><label><input type="checkbox" name="ctl$Fraction$3" value=".25">1/4 etatu</label><label><input type="checkbox" name="ctl$Fraction$4" value=".2">1/5 etatu</label></span>
</div>
<fieldset required><legend>Dostępność</legend><label><input type="radio" name="ctl$Availability" value="now">Od zaraz</label><label><input type="radio" name="ctl$Availability" value="weeks">2 - 3 tygodnie</label><label><input type="radio" name="ctl$Availability" value="month">1 miesiąc</label><label><input type="radio" name="ctl$Availability" value="months">3 miesiące</label><label><input type="radio" name="ctl$Availability" value="more">więcej, niż 3 miesiące</label></fieldset>
<label for="ctl_Salary">Podaj proszę przedział Twoich oczekiwań finansowych BRUTTO</label><select id="ctl_Salary" required><option value="">Choose</option><option>6000–8000 PLN</option><option>8000–10000 PLN</option></select>
<label for="ctl_Cv">CV</label><input id="ctl_Cv" type="file" required accept=".pdf,.doc,.docx,.txt">
<label for="ctl_Extra">Portfolio attachment</label><input id="ctl_Extra" type="file" accept=".pdf,.txt">
<label><input type="checkbox" id="ctl_Consent" required>Consent to current recruitment data processing</label>
<label><input type="checkbox" id="ctl_Future">Consent to future recruitment</label>
<button type="submit">Submit application</button>
</form><span id="fraction-validator">This answer is required</span>
<script>
window.Page_Validators = [{controltovalidate:'ctl_Fraction',enabled:true,evaluationfunction:function RequiredFieldValidatorEvaluateIsValid(){return false}}];
window.adds=0; window.submissions=0;
document.querySelector('form').onsubmit=e=>{e.preventDefault();window.submissions++};
document.querySelector('#ctl_AddLanguage').onclick=()=>{
 const language=document.querySelector('#ctl_Language'),level=document.querySelector('#ctl_Level'),state=document.querySelector('#ctl_LanguageState');
 if(!language.value || !level.value)return;
 const entries=JSON.parse(state.value);entries.push({language:language.value,level:level.value});state.value=JSON.stringify(entries);
 const row=document.createElement('li');row.textContent=language.selectedOptions[0].text+' '+level.selectedOptions[0].text;document.querySelector('#language-entries').append(row);
 window.adds++;language.value='';level.value='';
};
</script></body></html>
