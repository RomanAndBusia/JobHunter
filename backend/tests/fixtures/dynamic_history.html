<!doctype html><html><body><form><section id="employment"><div class="row"><label>Employer<input name="employer_0"></label><label>Role<input name="role_0"></label><label>Start month<input type="month" name="start_0"></label></div></section><button type="button" id="add">Add employment</button><script>
let n=1;document.querySelector('#add').onclick=()=>{const r=document.querySelector('.row').cloneNode(true);r.querySelectorAll('input').forEach(x=>x.name=x.name.replace('_0','_'+n));n++;document.querySelector('#employment').append(r)};
</script></form></body></html>
